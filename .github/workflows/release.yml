name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to package without publishing a release
        required: true
        default: 1.0.0

permissions:
  contents: write

jobs:
  package:
    name: Sign and notarize macOS release
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use semantic versioning." >&2
            exit 1
          fi
          project_version="$(awk -F ' = ' '/MARKETING_VERSION = / { gsub(/;/, "", $2); print $2; exit }' SpotPriceWidget.xcodeproj/project.pbxproj)"
          if [[ "$version" != "$project_version" ]]; then
            echo "Tag/input version $version does not match project version $project_version." >&2
            exit 1
          fi
          echo "SPOT_PRICE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Validate product metadata
        run: script/validate-product.sh

      - name: Require release credentials
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          for variable_name in CERTIFICATE_P12 CERTIFICATE_PASSWORD NOTARY_APPLE_ID NOTARY_TEAM_ID NOTARY_APP_PASSWORD; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "Required release secret is not configured: $variable_name" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/spot-price-release.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$CERTIFICATE_P12" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security >/dev/null
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path" >/dev/null
          identity="$(security find-identity -v -p codesigning "$keychain_path" | awk '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            echo "The certificate archive does not contain a Developer ID Application identity." >&2
            exit 1
          fi
          echo "SPOT_PRICE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SPOT_PRICE_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "SPOT_PRICE_RELEASE_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          rm -f "$certificate_path"

      - name: Build, sign, notarize, and package
        env:
          SPOT_PRICE_NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          SPOT_PRICE_NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          SPOT_PRICE_NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: script/package-release.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finland-Electricity-Rates-${{ env.SPOT_PRICE_VERSION }}
          path: |
            dist/Finland-Electricity-Rates.dmg
            dist/Finland-Electricity-Rates.dmg.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Finland-Electricity-Rates.dmg \
            dist/Finland-Electricity-Rates.dmg.sha256 \
            --verify-tag \
            --title "Finland Electricity Rates $SPOT_PRICE_VERSION" \
            --generate-notes

      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [[ -n "${SPOT_PRICE_RELEASE_KEYCHAIN:-}" && -f "$SPOT_PRICE_RELEASE_KEYCHAIN" ]]; then
            security delete-keychain "$SPOT_PRICE_RELEASE_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12"
