name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to package without publishing a release
        required: true
        default: 1.0.0

permissions:
  contents: read

jobs:
  package:
    name: Package direct macOS release
    runs-on: macos-26
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/grid-emissions-relay/package-lock.json

      - name: Verify relay source
        working-directory: backend/grid-emissions-relay
        run: |
          npm ci --ignore-scripts
          npm run check

      - name: Require tagged releases from stable
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch --no-tags origin stable
          stable_sha="$(git rev-parse FETCH_HEAD)"
          if [[ "$GITHUB_SHA" != "$stable_sha" ]]; then
            echo "Release tags must point to the current stable commit." >&2
            echo "tag=$GITHUB_SHA stable=$stable_sha" >&2
            exit 1
          fi

      - name: Select release version
        id: release-version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use semantic versioning." >&2
            exit 1
          fi
          project_version="$(awk -F ' = ' '/MARKETING_VERSION = / { gsub(/;/, "", $2); print $2; exit }' SpotPriceWidget.xcodeproj/project.pbxproj)"
          if [[ "$version" != "$project_version" ]]; then
            echo "Tag/input version $version does not match project version $project_version." >&2
            exit 1
          fi
          echo "SPOT_PRICE_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate product metadata
        run: script/validate-product.sh

      - name: Test Grid Conditions signal
        run: script/test-grid-conditions.sh

      - name: Build, ad-hoc sign, and package
        env:
          SPOT_PRICE_DISTRIBUTION: direct
        run: script/package-release.sh

      - name: Stage release notes
        run: cp docs/RELEASE-NOTES.md dist/RELEASE-NOTES.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Finland-Electricity-Rates-${{ env.SPOT_PRICE_VERSION }}
          path: |
            dist/Finland-Electricity-Rates.dmg
            dist/Finland-Electricity-Rates.dmg.sha256
            dist/RELEASE-NOTES.md
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Finland-Electricity-Rates-${{ needs.package.outputs.version }}
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Finland-Electricity-Rates.dmg \
            dist/Finland-Electricity-Rates.dmg.sha256 \
            --verify-tag \
            --title "Finland Electricity Rates ${{ needs.package.outputs.version }}" \
            --notes-file dist/RELEASE-NOTES.md
