name: Build

on:
  push:
    branches:
      - stable
      - maintenance
  pull_request:
    branches:
      - stable
      - maintenance

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay:
    name: Grid emissions relay
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/grid-emissions-relay

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/grid-emissions-relay/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Type-check and test relay
        run: npm run check

  build:
    name: ${{ matrix.name }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            destination: platform=macOS
          - name: iOS Simulator
            destination: generic/platform=iOS Simulator
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: xcodebuild -version

      - name: Validate product metadata
        run: script/validate-product.sh

      - name: Test Grid Conditions signal
        if: matrix.name == 'macOS'
        run: script/test-grid-conditions.sh

      - name: Build
        run: |
          xcodebuild -quiet \
            -project SpotPriceWidget.xcodeproj \
            -scheme SpotPriceWidget \
            -configuration Debug \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath '${{ runner.temp }}/DerivedData-${{ matrix.name }}' \
            CODE_SIGNING_ALLOWED=NO \
            build
